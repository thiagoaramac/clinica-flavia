<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Gestão Clínica Flávia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23b57a6c'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='30' fill='%23fffdfc' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#f8f3f0}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  .carregando{position:fixed;inset:0;display:grid;place-items:center;font:500 15px/1.4 system-ui,sans-serif;color:#8c7b76}
</style>
</head>
<body>
<div class="carregando" id="carregando">Carregando…</div>
<script>
  // O app roda no Google Apps Script; esta página só o exibe em tela cheia.
  // Sem chave, o app abre em modo apresentação. "Entrar para editar" (dentro do app) valida o código
  // de acesso e devolve a chave de edição, que fica guardada só neste navegador.
  var APP = "https://script.google.com/macros/s/AKfycbyX71PxdgahJSMnh_hUwd6axenxrmdn1Sg0b0zzweuqxUiLHoZLIpN53G1N4JRU0Uzq-A/exec";
  function lerChave(){ try { return localStorage.getItem("chave-clinica") || ""; } catch (e) { return ""; } }
  function gravarChave(k){ try { if (k) localStorage.setItem("chave-clinica", k); else localStorage.removeItem("chave-clinica"); } catch (e) {} }

  // links antigos com ?k=... ainda funcionam: a chave é guardada e some do endereço
  var q = new URLSearchParams(location.search);
  if (q.get("k")) { gravarChave(q.get("k")); history.replaceState(null, "", location.pathname + location.hash); }
  if (q.get("sair")) { gravarChave(""); history.replaceState(null, "", location.pathname + location.hash); }

  var f;
  function abrir(){
    var k = lerChave();
    if (f) f.remove();
    f = document.createElement("iframe");
    f.src = APP + (k ? "?k=" + encodeURIComponent(k) : "");
    f.title = "Gestão Clínica Flávia";
    f.setAttribute("allow", "clipboard-write");
    f.setAttribute("referrerpolicy", "no-referrer");
    f.onload = function(){ var c = document.getElementById("carregando"); if (c) c.remove(); };
    document.body.appendChild(f);
  }
  window.addEventListener("message", function(e){
    // o app do Google roda isolado (origem "null" ou *.googleusercontent.com); só aceita recados do próprio iframe
    if (!f || e.source !== f.contentWindow && !(e.origin === "null" || /(^|\.)googleusercontent\.com$/.test((function(){ try { return new URL(e.origin).hostname; } catch (x) { return ""; } })()))) return;
    var d = e.data || {};
    if (d.app !== "clinica-flavia") return;
    if (d.tipo === "chave" && typeof d.k === "string" && d.k.length < 200) { gravarChave(d.k); abrir(); }
    if (d.tipo === "sair") { gravarChave(""); abrir(); }
  });
  abrir();
</script>
</body>
</html>
